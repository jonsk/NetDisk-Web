<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- R-02:index.html 必须 no-cache(meta 与响应头双保险:
         中间层/本地文件打开时响应头不生效,而旧 index.html 引用已删除的资源
         会让用户看到白屏) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>网盘管理后台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
